# Build settings for the Astro rebuild.
# Production (main) still serves the old static site until launch (Phase 5).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Security headers. The Content Security Policy is a <meta> tag that Astro generates
# with hashes for every script and style (security.csp in astro.config.mjs).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Ping IndexNow (Bing) after each production deploy. Needs INDEXNOW_KEY.
[[plugins]]
  package = "/netlify/plugins/indexnow"

# --- Redirects from the old site (audit/redirects.md) ---
# The canonical host is www. Also set www as the primary domain in Netlify > Domain management.
[[redirects]]
  from = "https://courchevelluxuryconcierge.com/*"
  to = "https://www.courchevelluxuryconcierge.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Old image and stylesheet URLs (may be indexed in Google Images).
# The old logo may be linked from Instagram or directories: send it to the new one.
[[redirects]]
  from = "/assets/logo.png"
  to = "/icon-512.png"
  status = 301

[[redirects]]
  from = "/assets/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/css/*"
  to = "/"
  status = 301

# Fingerprinted build assets never change: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short links for review requests (QR code on the chalet welcome card, departure-day WhatsApp).
# They open the Google "write a review" box for the Business Profile.
[[redirects]]
  from = "/review"
  to = "https://search.google.com/local/writereview?placeid=ChIJPRJmAL2Kv4ARuPyRohUWW9M"
  status = 302
  force = true

[[redirects]]
  from = "/avis"
  to = "https://search.google.com/local/writereview?placeid=ChIJPRJmAL2Kv4ARuPyRohUWW9M"
  status = 302
  force = true
